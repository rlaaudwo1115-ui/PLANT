<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAA! Plant - Projects</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* 💡 갤러리 그리드 스타일 */
        .gallery-container { padding: 140px 60px 60px 60px; max-width: 1800px; margin: 0 auto; }
        .grid-wrapper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
        .grid-message { grid-column: 1 / -1; text-align: center; color: #777; font-size: 16px; padding: 100px 0; }
        .project-card { position: relative; display: block; aspect-ratio: 4 / 3; background-color: #e9ecef; overflow: hidden; cursor: pointer; border-radius: 4px; text-decoration: none; color: inherit; }
        .project-image { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.65); opacity: 0; transition: opacity 0.4s ease; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; }
        .project-card:hover .overlay { opacity: 1; }
        .project-card:hover .project-image { transform: scale(1.05); }
        .project-title { font-size: 20px; margin: 0 0 10px 0; letter-spacing: 0.5px; transform: translateY(15px); transition: transform 0.4s ease; }
        .project-author { font-size: 14px; color: #ddd; margin: 0; transform: translateY(15px); transition: transform 0.4s ease; transition-delay: 0.05s; }
        .project-card:hover .project-title, .project-card:hover .project-author { transform: translateY(0); }

        /* 📱 모바일 반응형 최적화 (768px 이하) */
        @media (max-width: 768px) {
            .gallery-container { padding: 100px 20px 50px 20px; }
            .grid-wrapper { grid-template-columns: 1fr; gap: 30px; }

            /* 모바일에서는 마우스 호버가 없으므로 카드 하단에 항상 제목/저자 표시 */
            .overlay {
                opacity: 1;
                background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.3) 50%, transparent 100%);
                justify-content: flex-end;
                align-items: flex-start;
                padding: 20px;
                text-align: left;
                box-sizing: border-box;
            }
            .project-title { font-size: 17px; margin: 0 0 4px 0; transform: translateY(0); font-weight: 700; }
            .project-author { font-size: 13px; color: #e0e0e0; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header id="site-header" data-active="project"></header>

    <main class="gallery-container">
        <div class="grid-wrapper" id="project-grid">
            <p class="grid-message">프로젝트 목록을 불러오는 중입니다...</p>
        </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="layout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>

    <script>
        async function loadProjects() {
            const urlParams = new URLSearchParams(window.location.search);
            const gradeFilter = urlParams.get('grade');
            const semesterFilter = urlParams.get('semester');
            const categoryFilter = urlParams.get('category');

            const grid = document.getElementById('project-grid');

            if (!supabaseClient) {
                grid.innerHTML = '<p class="grid-message">데이터베이스에 연결할 수 없습니다.</p>';
                return;
            }

            let query = supabaseClient.from('projects').select('*').order('created_at', { ascending: false });
            if (gradeFilter) query = query.eq('grade', parseInt(gradeFilter));
            if (semesterFilter) query = query.eq('semester', parseInt(semesterFilter));
            if (categoryFilter) query = query.eq('category', categoryFilter);

            const { data, error } = await query;

            if (error) {
                console.error('프로젝트 조회 실패:', error);
                grid.innerHTML = '<p class="grid-message">프로젝트 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</p>';
                return;
            }

            if (!data || data.length === 0) {
                grid.innerHTML = '<p class="grid-message">해당 카테고리에 등록된 프로젝트가 없습니다.</p>';
                return;
            }

            grid.innerHTML = data.map(project => `
                <a class="project-card" href="project_detail.html?id=${encodeURIComponent(project.id)}">
                    <img src="${escapeHTML(safeURL(project.thumbnail))}" alt="${escapeHTML(project.title)}" class="project-image" loading="lazy">
                    <div class="overlay">
                        <h3 class="project-title">${escapeHTML(project.title)}</h3>
                        <p class="project-author">${escapeHTML(project.author)}</p>
                    </div>
                </a>
            `).join('');
        }

        loadProjects();
    </script>
</body>
</html>
