<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLANT - Info</title>
    <link rel="stylesheet" href="common.css?v=20261110">
    <style>
        .info-container { padding: 180px 60px 100px 60px; max-width: 1000px; margin: 0 auto; }
        .section-title { font-size: 28px; font-weight: bold; letter-spacing: -1px; color: #111; margin-bottom: 50px; border-left: 4px solid #111; padding-left: 15px; }
        .management-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-bottom: 120px; }
        .management-card { text-align: center; }
        .management-photo-holder { width: 100%; aspect-ratio: 1 / 1; margin-bottom: 20px; overflow: hidden; display: flex; justify-content: center; align-items: center; background-color: #eee; }
        .management-photo { width: 100%; height: 100%; object-fit: cover; background-color: #eee; }
        .management-info { font-size: 16px; color: #111; letter-spacing: 0.5px; font-weight: 500; }

        .org-chart-container { padding: 20px 0; }
        .org-chart-title { font-size: 20px; font-weight: bold; margin: 0; text-align: center; margin-bottom: 40px; color: #111; }
        .bureau-grid { display: flex; width: 100%; }
        .bureau-box { flex: 1; text-align: center; }
        .bureau-box h3 { font-size: 18px; margin: 0 0 20px 0; font-weight: bold; color: #111; }
        .member-list { font-size: 15px; line-height: 2; color: #555; list-style: none; padding: 0; margin: 0; }

        /* 📱 모바일 반응형 최적화 */
        @media (max-width: 768px) {
            .info-container { padding: 100px 20px 60px 20px; }
            .section-title { font-size: 22px; margin-bottom: 35px; }

            /* 운영진 모바일에서는 3열 그리드로 유지 */
            .management-grid { grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 60px; }
            .management-info { font-size: 13px; }

            /* 부서별 조직도 수직 배치 */
            .bureau-grid { flex-direction: column; gap: 35px; }
            .bureau-box h3 { margin-bottom: 12px; }
        }
    </style>
</head>
<body>
    <header id="site-header" data-active="info"></header>

    <main class="info-container">
        <h2 class="section-title">MANAGEMENT TEAM</h2>
        <div class="management-grid">
            <div class="management-card"><div class="management-photo-holder"><img src="images/kmj profile.jpg" alt="김명재" class="management-photo"></div><div class="management-info">김명재</div></div>
            <div class="management-card"><div class="management-photo-holder"></div><div class="management-info">박지선</div></div>
            <div class="management-card"><div class="management-photo-holder"><img src="images/csh profile.jpg" alt="최수호" class="management-photo"></div><div class="management-info">최수호</div></div>
            <div class="management-card"><div class="management-photo-holder"></div><div class="management-info">구민정</div></div>
            <div class="management-card"><div class="management-photo-holder"></div><div class="management-info">김연우</div></div>
        </div>


        <div class="org-chart-container">
            <h3 class="org-chart-title">YAA!</h3>
            <div class="bureau-grid">
                <div class="bureau-box"><h3>기획국</h3><ul class="member-list"><li>오지은</li><li>김예진</li><li>박수민</li><li>정성운</li></ul></div>
                <div class="bureau-box"><h3>관리국</h3><ul class="member-list"><li>김명재</li><li>박지선</li><li>최수호</li><li>구민정</li><li>김연우</li></ul></div>
                <div class="bureau-box"><h3>홍보국</h3><ul class="member-list"><li>명수아</li><li>김지우</li><li>이솔희</li><li>이규영</li><li>김가현</li><li>이현서</li></ul></div>
            </div>
        </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>
    <script src="layout.js?v=20261110"></script>
</body>
</html>
