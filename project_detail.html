<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAA! Plant - Project Detail</title>
    <link rel="stylesheet" href="common.css">
    <style>
        /* --- 상세 페이지 레이아웃 --- */
        .detail-container { padding: 140px 60px 100px 60px; max-width: 1400px; margin: 0 auto; }
        .back-btn { display: inline-block; margin-bottom: 40px; text-decoration: none; color: #111; font-weight: bold; font-size: 15px; border-bottom: 1px solid #111; padding-bottom: 2px; transition: opacity 0.3s; }
        .back-btn:hover { opacity: 0.6; }

        .hero-image {
            width: 100%; height: auto; max-height: 80vh;
            object-fit: contain; background-color: transparent;
            margin-bottom: 60px;
        }
        .hero-image:not([src]) { display: none; }

        .content-split { display: flex; gap: 80px; align-items: flex-start; }
        /* 왼쪽 텍스트: 화면에 고정된 채로, 내용이 길면 자체 스크롤 */
        .project-info {
            flex: 1; position: sticky; top: 140px;
            max-height: calc(100vh - 160px);
            overflow-y: auto;
            overscroll-behavior: contain;
            padding-right: 12px;
            scrollbar-width: thin;
            scrollbar-color: #ccc transparent;
        }
        .project-info::-webkit-scrollbar { width: 4px; }
        .project-info::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
        .project-title { font-size: 20px; font-weight: bold; letter-spacing: -1px; margin: 0 0 15px 0; }
        .project-meta { font-size: 14px; color: #777; margin-bottom: 40px; border-bottom: 1px solid #dcdcdc; padding-bottom: 20px; }
        .project-meta span { display: inline-block; margin-right: 15px; }
        .project-desc { font-size: 16px; line-height: 1.8; color: #444; word-break: keep-all; white-space: pre-line; }
        .project-gallery { flex: 3.5; display: flex; flex-direction: column; gap: 10px; }
        .project-gallery img { width: 100%; background-color: transparent; }

        /* 📱 모바일 반응형 최적화 */
        @media (max-width: 768px) {
            .detail-container { padding: 90px 20px 60px 20px; }
            .back-btn { margin-bottom: 25px; font-size: 14px; }
            .hero-image { max-height: 50vh; margin-bottom: 30px; }

            /* 좌우 분할을 상하 수직 배치로 전환 */
            .content-split { flex-direction: column; gap: 40px; }
            .project-info { position: static; width: 100%; max-height: none; overflow: visible; padding-right: 0; }
            .project-title { font-size: 22px; margin-bottom: 12px; }
            .project-meta { margin-bottom: 25px; padding-bottom: 15px; font-size: 13px; }
            .project-desc { font-size: 15px; line-height: 1.7; }
            .project-gallery { width: 100%; gap: 15px; }
        }
    </style>
</head>
<body>

    <header id="site-header" data-active="project"></header>

    <main class="detail-container">
        <a href="main.html" onclick="if (history.length > 1) { history.back(); return false; }" class="back-btn">← Back</a>
        <img alt="" class="hero-image" id="detail-hero-image">
        <div class="content-split">
            <div class="project-info">
                <h1 class="project-title" id="detail-title">불러오는 중...</h1>
                <div class="project-meta">
                    <span><strong>Year</strong> <span id="detail-year"></span></span>
                    <span><strong>Type</strong> <span id="detail-type"></span></span>
                    <span><strong>Author</strong> <span id="detail-author"></span></span>
                </div>
                <p class="project-desc" id="detail-desc"></p>
            </div>
            <div class="project-gallery" id="detail-gallery"></div>
        </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="layout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>

    <script>
        async function loadProjectDetail() {
            const projectId = new URLSearchParams(window.location.search).get('id');
            const titleEl = document.getElementById('detail-title');

            if (!supabaseClient || !projectId) {
                titleEl.textContent = '프로젝트를 찾을 수 없습니다.';
                return;
            }

            const { data: project, error } = await supabaseClient
                .from('projects')
                .select('*')
                .eq('id', projectId)
                .maybeSingle();

            if (error || !project) {
                if (error) console.error('상세 조회 실패:', error);
                titleEl.textContent = '프로젝트를 찾을 수 없습니다.';
                return;
            }

            document.title = `${project.title} - YAA! Plant`;
            const heroSrc = safeURL(project.thumbnail);
            if (heroSrc) document.getElementById('detail-hero-image').src = heroSrc;
            document.getElementById('detail-hero-image').alt = project.title;
            titleEl.textContent = project.title;
            document.getElementById('detail-year').textContent = project.year || '-';
            document.getElementById('detail-type').textContent = project.type || '-';
            document.getElementById('detail-author').textContent = project.author || '-';

            // 설명은 일반 텍스트로 표시 (예전에 <br>로 저장된 줄바꿈도 줄바꿈으로 변환)
            const desc = (project.description || '').replace(/<br\s*\/?>/gi, '\n');
            document.getElementById('detail-desc').textContent = desc;

            const gallery = document.getElementById('detail-gallery');
            gallery.innerHTML = '';
            (project.detail_images || []).forEach(imgUrl => {
                const src = safeURL(imgUrl);
                if (!src) return;
                const img = document.createElement('img');
                img.src = src;
                img.alt = `${project.title} detail`;
                img.loading = 'lazy';
                gallery.appendChild(img);
            });
        }

        loadProjectDetail();
    </script>
</body>
</html>
