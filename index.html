<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAA! Plant Archive</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        #intro-svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            animation: rotateText 120s linear infinite; 
            will-change: transform;
        }

        @keyframes rotateText {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .text-ring {
            fill: #ffffff;
            font-weight: 700;
            letter-spacing: -0.5px; 
            dominant-baseline: middle; 
            text-anchor: middle;
        }

        /* 모바일/PC 공통 터치 안내 */
        .enter-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
            pointer-events: none;
            animation: pulseHint 2s infinite ease-in-out;
            white-space: nowrap;
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div id="intro-container"></div>
    <div class="enter-hint">Tap anywhere to enter</div>

    <script>
        const container = document.getElementById('intro-container');
        const textWord = "PLANT"; 

        function drawRings() {
            container.innerHTML = ''; 
            
            const width = window.innerWidth;
            const height = window.innerHeight;
            const minScreen = Math.min(width, height);
            
            // 모바일 화면 폭에 맞춰 시작 갭과 증가율 동적 계산
            const isMobile = width <= 768;
            const startGap = isMobile ? Math.max(26, Math.floor(minScreen * 0.08)) : 50;
            const gapIncrease = isMobile ? Math.max(10, Math.floor(minScreen * 0.035)) : 20;

            const maxRadius = Math.ceil(Math.sqrt(Math.pow(width / 2, 2) + Math.pow(height / 2, 2))) + 40;

            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.id = "intro-svg";
            svg.setAttribute("viewBox", `-${maxRadius} -${maxRadius} ${maxRadius * 2} ${maxRadius * 2}`);
            svg.style.width = `${maxRadius * 2}px`;
            svg.style.height = `${maxRadius * 2}px`;

            let currentRadius = 0;
            let currentGap = startGap;
            let i = 1;

            while (currentRadius < maxRadius) {
                currentRadius += currentGap; 
                const pathId = `ring-path-${i}`;
                
                const path = document.createElementNS(svgNS, "path");
                path.setAttribute("d", `M 0, -${currentRadius} A ${currentRadius},${currentRadius} 0 1,1 0,${currentRadius} A ${currentRadius},${currentRadius} 0 1,1 0,-${currentRadius}`);
                path.id = pathId;
                path.setAttribute("fill", "none");
                svg.appendChild(path);

                const textElem = document.createElementNS(svgNS, "text");
                textElem.setAttribute("class", "text-ring");
                textElem.setAttribute("font-size", `${currentGap * 1.05}px`); 

                const textPath = document.createElementNS(svgNS, "textPath");
                textPath.setAttribute("href", `#${pathId}`);
                
                const circumference = 2 * Math.PI * currentRadius;
                const charWidthGuess = currentGap * 0.55; 
                const wordLengthGuess = (textWord.length + 1) * charWidthGuess;
                const repeatCount = Math.ceil(circumference / wordLengthGuess) * 2; 

                textPath.textContent = (textWord + "\u00A0\u00A0").repeat(repeatCount);

                textElem.appendChild(textPath);
                svg.appendChild(textElem);

                currentGap += gapIncrease; 
                i++;
            }
            container.appendChild(svg);
        }

        drawRings();
        window.addEventListener('resize', drawRings);

        document.body.addEventListener('click', () => {
            window.location.href = 'main.html';
        });
    </script>
</body>
</html>
